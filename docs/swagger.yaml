info:
  contact: {}
paths:
  /api/v1/dashboard:
    get:
      consumes:
      - application/json
      description: Retrieve dashboard data including total rooms, total visitors,
        total reservations, and total omzet within a specified date range.
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: startDate
        required: true
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: endDate
        required: true
        type: string
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponseDashboard'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get dashboard data for reservations
      tags:
      - dashboard
  /api/v1/reservation:
    post:
      consumes:
      - application/json
      description: Create a reservation with room details
      parameters:
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Reservation Information
        in: body
        name: reservation
        required: true
        schema:
          $ref: '#/definitions/models.ReservationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.SuccessResponseCreateReservation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create a new reservation
      tags:
      - reservation
  /api/v1/reservation/{id}:
    get:
      consumes:
      - application/json
      description: Get the details of a reservation by its ID
      parameters:
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ReservationCalculationReservation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get reservation by ID
      tags:
      - reservation
  /api/v1/reservation/calculation:
    get:
      consumes:
      - application/json
      description: Calculate the total cost for a room reservation based on room,
        snack, participant count, and time
      parameters:
      - description: Room ID
        in: query
        name: room_id
        required: true
        type: integer
      - description: Snack ID
        in: query
        name: snack_id
        type: integer
      - description: Start time (YYYY-MM-DD HH:MM:SS)
        in: query
        name: startTime
        required: true
        type: string
      - description: End time (YYYY-MM-DD HH:MM:SS)
        in: query
        name: endTime
        required: true
        type: string
      - description: Number of participants
        in: query
        name: participant
        required: true
        type: integer
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      - description: User name
        in: query
        name: name
        required: true
        type: string
      - description: Phone number
        in: query
        name: phoneNumber
        required: true
        type: string
      - description: Company name
        in: query
        name: company
        required: true
        type: string
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponseReservationCalculation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Endpoint for calculating reservation
      tags:
      - reservation
  /api/v1/reservation/history:
    get:
      consumes:
      - application/json
      description: Retrieve the reservation history within a specified date range
        with pagination
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        required: true
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        required: true
        type: string
      - description: Reservation type
        in: query
        name: type
        type: string
      - description: Reservation status
        in: query
        name: status
        type: string
      - description: Page number (default is 1)
        in: query
        name: page
        type: integer
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponseHistory'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get reservation history
      tags:
      - reservation
  /api/v1/reservation/status/{id}:
    put:
      consumes:
      - application/json
      description: Update the status of a reservation
      parameters:
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: New reservation status
        in: body
        name: reservation
        required: true
        schema:
          $ref: '#/definitions/models.UpdateReservationStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponseUpdateReservationStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update reservation status
      tags:
      - reservation
  /api/v1/reservations/schedules:
    get:
      consumes:
      - application/json
      description: Retrieve the reservation schedule within a specified date range
        with pagination
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        required: true
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        required: true
        type: string
      - description: Page number (default is 1)
        in: query
        name: page
        type: integer
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponseReservationSchedule'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get reservation schedule
      tags:
      - reservation
  /api/v1/rooms:
    get:
      consumes:
      - application/json
      description: Get all rooms with pagination, name, type, picture, price_per_hour,
        and capacity
      parameters:
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Room name
        in: query
        name: name
        type: string
      - description: Room type
        in: query
        name: type
        type: string
      - description: Room capacity
        in: query
        name: capacity
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Number of records per page
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponseRoom'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Endpoint Get all rooms with pagination
      tags:
      - rooms
    post:
      consumes:
      - application/json
      description: Create a new room with name, type, picture, price_per_hour, and
        capacity
      parameters:
      - description: Room object
        in: body
        name: room
        required: true
        schema:
          $ref: '#/definitions/models.CreateRoom'
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.SuccessResponseRoom'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Endpoint create a new room
      tags:
      - rooms
  /api/v1/rooms/{id}:
    delete:
      consumes:
      - application/json
      description: Delete Room by id with id in the URL path
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponseRoom'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Endpoint for Delete Room by id
      tags:
      - rooms
    put:
      consumes:
      - application/json
      description: Update room by id with id in the URL path
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Room update object
        in: body
        name: room
        required: true
        schema:
          $ref: '#/definitions/models.CreateRoom'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponseRoom'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Endpoint for updating room by id
      tags:
      - rooms
  /api/v1/rooms/{id}/reservation:
    get:
      consumes:
      - application/json
      description: Retrieve the reservation schedule for a specific room on a given
        date
      parameters:
      - description: Room ID
        in: query
        name: id
        required: true
        type: integer
      - description: Date (YYYY-MM-DD)
        in: query
        name: start_date
        required: true
        type: string
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponseRoomsReservationSchedule'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get room reservation schedule
      tags:
      - reservation
  /api/v1/snack:
    get:
      consumes:
      - application/json
      description: Snack
      parameters:
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponseSnack'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Endpoint for snack by id
      tags:
      - snacks
  /api/v1/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload an image file and save it to the server
      parameters:
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Upload file
      tags:
      - upload
  /api/v1/users/{id}:
    get:
      consumes:
      - application/json
      description: User by id with id in the URL path
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Bearer <JWT Token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
